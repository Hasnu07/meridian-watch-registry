<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meridian — Sign in</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'IBM Plex Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .grid-bg {
      background-color: #0A0E14;
      background-image:
        linear-gradient(rgba(34, 211, 255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 255,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
    }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center;
      background: linear-gradient(135deg, #22D3FF 0%, #9B6BFF 100%);
      color: #04101F; font: 700 20px 'IBM Plex Mono', monospace;
    }
    .field:focus { border-color: #22D3FF; box-shadow: 0 0 0 3px rgba(34, 211, 255,0.22); outline: none; }
    :focus-visible { outline: 2px solid #22D3FF; outline-offset: 2px; }
    input:-webkit-autofill,
    input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 100px #070A0F inset;
      -webkit-text-fill-color: #E6EDF7;
    }
    .brand-mark { box-shadow: 0 0 18px rgba(34,211,255,0.4), 0 0 34px rgba(155,107,255,0.3); }
    .grid-bg { background-image: radial-gradient(700px 420px at 85% 0%, rgba(155,107,255,0.14), transparent 60%), radial-gradient(600px 400px at 10% 100%, rgba(34,211,255,0.10), transparent 60%), linear-gradient(rgba(34,211,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,255,0.05) 1px, transparent 1px); background-size: auto, auto, 48px 48px, 48px 48px; }
    .neon-card { position: relative; }
    .neon-card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; border-radius: 8px 8px 0 0; background: linear-gradient(90deg, #22D3FF, #9B6BFF, #FF3DCB); box-shadow: 0 0 14px rgba(155,107,255,0.6); }
    .neon-btn { background-image: linear-gradient(135deg, #22D3FF 0%, #3DB4FF 55%, #6B8CFF 100%); box-shadow: 0 0 0 1px rgba(34,211,255,0.5), 0 0 18px rgba(34,211,255,0.35); }
    .neon-btn:hover { box-shadow: 0 0 0 1px rgba(34,211,255,0.8), 0 0 26px rgba(34,211,255,0.55); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
  <link rel="stylesheet" href="/css/app.css?v=f648d974e8">
</head>
<body class="grid-bg min-h-screen flex items-center justify-center text-on-surface">

  <div class="w-full max-w-sm px-4">
    <!-- Brand -->
    <div class="flex items-center gap-3 mb-8">
      <div class="brand-mark">M</div>
      <div class="leading-tight">
        <h1 class="text-xl font-bold tracking-tight text-on-surface">Meridian</h1>
        <p class="text-xs font-mono text-outline">Watch Registry</p>
      </div>
    </div>

    <!-- Login card -->
    <div class="neon-card bg-surface-container border border-outline-variant rounded-lg p-7 shadow-2xl shadow-black/40">
      <h2 class="text-lg font-semibold text-on-surface">Sign in</h2>
      <p class="text-on-surface-variant text-sm mt-1 mb-6">Use your registry account to continue.</p>

      <form id="loginForm" autocomplete="off">
        <div class="mb-4">
          <label for="username" class="block text-sm font-medium text-on-surface-variant mb-1.5">Username</label>
          <input
            type="text"
            id="username"
            autocomplete="username"
            required
            class="field w-full bg-[#070A0F] border border-outline-variant rounded-lg px-4 h-11 text-on-surface text-sm placeholder-outline/70 transition-all"
            placeholder="username"
          >
        </div>
        <div class="mb-5">
          <label for="password" class="block text-sm font-medium text-on-surface-variant mb-1.5">Password</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              autocomplete="current-password"
              required
              class="field w-full bg-[#070A0F] border border-outline-variant rounded-lg pl-4 pr-11 h-11 text-on-surface text-sm placeholder-outline/70 transition-all"
              placeholder="Enter password"
            >
            <button type="button" id="togglePass" aria-label="Show password" class="absolute right-1.5 top-1/2 -translate-y-1/2 w-9 h-9 grid place-items-center rounded-md text-outline hover:text-on-surface hover:bg-white/5 transition-colors">
              <span class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </div>

        <div id="loginError" role="alert" class="hidden mb-4 px-4 py-3 rounded-lg bg-error-container/40 border border-error/30 text-error text-sm"></div>

        <button
          type="submit"
          id="loginBtn"
          class="neon-btn w-full bg-primary text-on-primary font-semibold h-11 rounded-lg text-sm hover:brightness-110 active:brightness-95 disabled:opacity-60 transition-all"
        >
          Sign In
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-outline/60 mt-6 font-mono">Meridian Watch Registry © 2026</p>
  </div>

  <script>
    // Toggle password visibility
    document.getElementById('togglePass').addEventListener('click', () => {
      const inp = document.getElementById('password');
      const ico = document.querySelector('#togglePass .material-symbols-outlined');
      if (inp.type === 'password') { inp.type = 'text'; ico.textContent = 'visibility_off'; document.getElementById('togglePass').setAttribute('aria-label', 'Hide password'); }
      else { inp.type = 'password'; ico.textContent = 'visibility'; document.getElementById('togglePass').setAttribute('aria-label', 'Show password'); }
    });

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      err.classList.add('hidden');
      btn.textContent = 'Signing in…';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        if (res.ok) {
          window.location.href = '/dashboard';
        } else {
          const data = await res.json();
          err.textContent = data.error || 'Invalid credentials';
          err.classList.remove('hidden');
          btn.textContent = 'Sign In';
          btn.disabled = false;
        }
      } catch {
        err.textContent = 'Network error — please try again';
        err.classList.remove('hidden');
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
