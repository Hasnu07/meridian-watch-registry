<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patek Desk — pricing &amp; negotiation terminal</title>
  <link rel="stylesheet" href="/neon.css?v=d2d1ae7517">
  <script src="/cursor.js?v=a8380fbe4f"></script>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Pin the layout: html/body/#root each fill 100% with overflow hidden.
       The React app inside uses its own flex-column where the header is
       flex-shrink:0 (always visible) and the content pane scrolls. This is
       more reliable than position:sticky when embedded in an iframe whose
       parent has its own scroll context. */
    html, body, #root { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: #070A0F; font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; font-feature-settings: 'tnum' 1; color: #E6EDF7; }
    #__boot { position: fixed; inset: 0; display: grid; place-items: center; background: #070A0F; }
    #__boot .mark { width: 96px; height: 96px; border-radius: 22px; border: 3px solid #22D3FF; display: grid; place-items: center; color: #22D3FF; font-weight: 700; font-size: 38px; letter-spacing: 0.08em; font-family: "IBM Plex Mono", monospace; }
  </style>
</head>
<body>
  <div id="root">
    <div id="__boot">
      <div class="mark">PK</div>
    </div>
  </div>
  <div id="__err" style="position:fixed;left:12px;right:12px;bottom:12px;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;max-height:40vh;overflow:auto;display:none;z-index:9999;"></div>

  <script>
    // Surface load-time errors so we never end up with a silent blank page.
    window.addEventListener('error', (e) => {
      const box = document.getElementById('__err');
      if (box) { box.style.display = 'block'; box.textContent += '[error] ' + (e.message || e.type) + '\n'; }
    });
    window.addEventListener('unhandledrejection', (e) => {
      const box = document.getElementById('__err');
      if (box) { box.style.display = 'block'; box.textContent += '[promise] ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason) + '\n'; }
    });
  </script>

  <!-- Patek Desk app — built from src/patek-desk/app.jsx by "npm run build". -->
  <script src="/js/patek-desk.js?v=1ef804d289" defer></script>
</body>
</html>
